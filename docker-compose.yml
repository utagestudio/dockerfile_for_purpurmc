name: purpur
services:
  purpur:
    container_name: purpur
    build:
      context: .
      dockerfile: Dockerfile
    # Pass only the variables each service needs (values come from .env).
    environment:
      - VERSION=${VERSION}
      - TZ=${TZ}
      - JAVA_MEMORY_MAX=${JAVA_MEMORY_MAX}
      - JAVA_MEMORY_MIN=${JAVA_MEMORY_MIN}
      - EULA=${EULA}
    image: purpur_image
    volumes:
      - purpur_volume:/opt/minecraft
      - ./setup:/opt/setup
      - ./backup:/opt/backup
    ports:
      - 25565:25565
    command: start
    stop_signal: SIGINT
    stop_grace_period: 150s
    depends_on:
      - log_watcher
  log_watcher:
    container_name: log_watcher
    build:
      context: .
      dockerfile: Dockerfile_logwatcher
    environment:
      - TZ=${TZ}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
    image: log_watcher_image
    volumes:
      - purpur_volume:/opt/minecraft:ro
volumes:
  purpur_volume:
